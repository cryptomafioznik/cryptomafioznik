name: deploy checkout

# The only manual step, once: GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret:
#   CLOUDFLARE_API_TOKEN   Cloudflare dashboard -> My Profile -> API Tokens -> Create Token ->
#                          template "Edit Cloudflare Workers", add permission "D1: Edit"
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard -> Workers & Pages -> Account ID (right column)
#   ADMIN_TOKEN            any long random string; it is the password for /admin
#   RESEND_API_KEY         optional, enables receipt emails
# Database, schema, license signing key and the deploy itself are handled here.

on:
  push:
    branches: ["**"]
    paths: ["checkout/**", ".github/workflows/deploy-checkout.yml"]
  workflow_dispatch:

concurrency: deploy-checkout

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkout
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: checkout/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

      - name: Check Cloudflare secrets
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set: tests passed, deploy skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure D1 database exists and wire its id
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -e
          ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s).find(x=>x.name==="checkout");process.stdout.write(d?d.uuid:"")})')
          if [ -z "$ID" ]; then
            ID=$(npx wrangler d1 create checkout | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          fi
          sed -i "s/REPLACE_WITH_D1_ID/$ID/" wrangler.toml
          npx wrangler d1 execute checkout --remote --file=./schema.sql

      - name: Ensure worker secrets exist
        if: steps.gate.outputs.ready == 'true'
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -e
          HAVE=$(npx wrangler secret list --format json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).map(x=>x.name).join(","))}catch{process.stdout.write("")}})' || true)
          # License signing key: generated once on the first deploy, never printed, never rotated by CI.
          case ",$HAVE," in *,LICENSE_SECRET,*) ;; *) openssl rand -hex 32 | npx wrangler secret put LICENSE_SECRET ;; esac
          if [ -n "$ADMIN_TOKEN" ]; then printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN; fi
          if [ -n "$RESEND_API_KEY" ]; then printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY; fi

      - name: Deploy worker
        if: steps.gate.outputs.ready == 'true'
        run: npx wrangler deploy
