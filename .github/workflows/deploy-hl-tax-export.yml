name: deploy hl-tax-export web

# Uses the same CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets as the checkout workflow
# (the token template "Edit Cloudflare Workers" also covers Pages). Optional repo variable
# CHECKOUT_URL (Settings -> Secrets and variables -> Actions -> Variables) wires the "buy" button
# and license verification to the deployed checkout, e.g. https://crypto-checkout.<sub>.workers.dev

on:
  push:
    branches: ["**"]
    paths: ["hl-tax-export/**", ".github/workflows/deploy-hl-tax-export.yml"]
  workflow_dispatch:

concurrency: deploy-hl-tax-export

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hl-tax-export
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CHECKOUT_URL: ${{ vars.CHECKOUT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hl-tax-export/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:web

      - name: Check Cloudflare secrets
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set: build passed, deploy skipped." >> "$GITHUB_STEP_SUMMARY"; echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -e
          npx wrangler pages project list 2>/dev/null | grep -q "hl-tax-export" || npx wrangler pages project create hl-tax-export --production-branch main
          npx wrangler pages deploy dist --project-name hl-tax-export --branch main --commit-dirty=true
          echo "Site: https://hl-tax-export.pages.dev" >> "$GITHUB_STEP_SUMMARY"
