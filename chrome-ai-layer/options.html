<!doctype html>
<html><head><meta charset="utf-8"><title>AI Chat Layer options</title><style>
body{max-width:560px;margin:0 auto;padding:24px 16px;font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;color:#111;background:#fff}
@media(prefers-color-scheme:dark){body{background:#0f0f10;color:#f2f2f2}input,textarea{background:#18181b;color:#f2f2f2;border-color:#333}}
h1{font-size:20px}h2{font-size:16px;margin-top:28px}label{display:block;margin:10px 0 4px}
input,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #ddd;border-radius:8px;font:inherit}
.btn{display:inline-block;border:0;border-radius:8px;padding:9px 14px;background:#111;color:#fff;font:inherit;font-weight:600;cursor:pointer;margin:6px 6px 0 0}
.muted{opacity:.65}.msg{padding:8px 10px;border-radius:8px;background:rgba(21,128,61,.12);margin:10px 0}.msg.err{background:rgba(185,28,28,.12)}
</style></head><body>
<h1>AI Chat Layer</h1>
<p class="muted">Folders, prompts and exports live only in this browser. Nothing is uploaded.</p>

<h2>License</h2>
<label for="checkout">Checkout URL (where licenses are verified)</label>
<input id="checkout" placeholder="https://pay.example.com">
<label for="key">License key</label>
<input id="key" placeholder="CHROME-XXXX-XXXX-XXXX-XXXX">
<p><button class="btn" id="activate">Activate</button> <span id="lic" class="muted"></span></p>
<p class="muted">Free: 3 folders, 10 prompts, unlimited exports. Pro: no limits. One key works in every browser you sign into.</p>
<div id="msg" hidden class="msg"></div>

<h2>Backup</h2>
<p><button class="btn" id="export">Download JSON backup</button> <button class="btn" id="import">Import JSON</button><input id="file" type="file" accept="application/json" hidden></p>
<script src="options.js"></script>
</body></html>
