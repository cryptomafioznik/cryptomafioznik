name = "hl-whale-bot"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "whalebot"
database_id = "REPLACE_WITH_D1_ID"

[vars]
# Wallets checked per cron run. Free Workers plan allows 50 subrequests per invocation; each wallet
# costs 1 fetch plus 1 per alert sent. 30 keeps headroom. Paid plan: raise to 400.
WALLETS_PER_RUN = "30"
FREE_WALLETS = "3"
PRO_WALLETS = "25"
PRO_PRICE_STARS = "150"
PRO_DAYS = "30"
TAX_EXPORT_URL = "https://hl-tax-export.pages.dev"

# Secrets: TELEGRAM_BOT_TOKEN (from @BotFather), WEBHOOK_SECRET (random), ADMIN_TOKEN (random)
